name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always



jobs:
  # ── Verification Gates ────────────────────────────────────────────────────
  verify:
    name: Test & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version consistency and tag match
        run: |
          bash scripts/bump-version.sh --check
          # A tag build must produce artifacts labelled with that tag.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            have=$(bash scripts/bump-version.sh --current)
            if [ "$tag" != "$have" ]; then
              echo "ERROR: tag $GITHUB_REF_NAME builds artifacts labelled $have" >&2
              exit 1
            fi
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config libssl-dev avahi-daemon libavahi-client-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Tests
        run: cargo test --workspace
      - name: Cargo Audit
        run: |
          cargo install cargo-audit
          cargo audit

  # ── Windows x64 installer ─────────────────────────────────────────────────
  release-windows:
    needs: verify
    name: Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      # Native AOT publish needs the SDK the project targets (net10.0); the runner's
      # preinstalled SDKs are not guaranteed to include it.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Rust DLL
        run: cargo build --release -p deskdrop-core

      - name: Build C# app
        run: |
          Copy-Item target\release\deskdrop_core.dll `
                    platforms\windows\Deskdrop.WinUI\
          # Native AOT (PublishAot in the csproj): Deskdrop.exe is compiled to native code,
          # with no .NET runtime shipped. Still a folder publish, since the Windows App SDK
          # runtime, deskdrop_core.dll and tray\ sit next to the exe.
          dotnet publish platforms\windows\Deskdrop.WinUI\Deskdrop.WinUI.csproj `
            -c Release -r win-x64 --self-contained true `
            -o publish\windows

      - name: Check Windows publish
        run: |
          foreach ($f in 'Deskdrop.exe', 'deskdrop_core.dll', 'tray\Deskdrop.Tray.exe') {
            if (-not (Test-Path "publish\windows\$f")) { throw "missing $f in publish output" }
          }
          pwsh scripts\windows-size.ps1 publish\windows

      - name: Build MSI
        run: |
          dotnet tool install -g wix --version 5.*
          wix build platforms\windows\installer\Deskdrop.wxs `
            -d "AppDir=$PWD\publish\windows" -bindpath platforms\windows\installer -arch x64 `
            -o LinkAll-windows-x64.msi
          Compress-Archive -Path publish\windows\* -DestinationPath LinkAll-windows-x64.zip
          pwsh scripts\windows-size.ps1 publish\windows LinkAll-windows-x64.msi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskdrop-windows
          path: |
            LinkAll-windows-x64.msi
            LinkAll-windows-x64.zip

  # ── Android APK ───────────────────────────────────────────────────────────
  release-android:
    needs: verify
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK + cargo-ndk
        run: |
          sdkmanager "ndk;26.1.10909125"
          cargo install cargo-ndk --locked

      - name: Build native libs
        run: |
          cargo ndk \
            --platform 26 \
            -t aarch64-linux-android \
            -t armv7-linux-androideabi \
            -t x86_64-linux-android \
            -o platforms/android/app/src/main/jniLibs \
            build --lib --release -p deskdrop-core
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125

      - name: Decode keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "Error: ANDROID_KEYSTORE_B64 secret is missing"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > platforms/android/app/release.keystore

      # Direct-download APK (full) and the Google Play bundle (play flavor).
      - name: Build APK and Play bundle
        run: ./gradlew :app:assembleFullRelease :app:bundlePlayRelease
        working-directory: platforms/android
        env:
          DESKDROP_KEYSTORE: release.keystore
          DESKDROP_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DESKDROP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DESKDROP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name the APK
        run: mv platforms/android/app/build/outputs/apk/full/release/app-full-release.apk LinkAll-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deskdrop-android
          path: LinkAll-android.apk

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: deskdrop-android-play
          path: platforms/android/app/build/outputs/bundle/playRelease/*.aab

  # ── macOS DMG ─────────────────────────────────────────────────────────────
  release-macos:
    needs: verify
    name: macOS Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: brew install create-dmg

      - name: Build macOS app
        run: ./scripts/build-macos.sh --release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskdrop-macos
          path: platforms/macos/build/LinkAll.dmg

  # ── Linux x86_64 binary + deb ─────────────────────────────────────────────
  release-linux:
    needs: verify
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libdbus-1-dev libudev-dev libssl-dev pkg-config

      - name: Build daemon + CLI + GTK
        run: |
          cargo build --release --bin deskdrop-daemon -p deskdrop-core
          cargo build --release --bin deskdrop-cli -p deskdrop-cli
          cargo build --release --bin deskdrop-gtk -p deskdrop-linux

      - name: Package .tar.gz
        run: |
          mkdir -p dist/deskdrop/usr/local/bin
          cp target/release/deskdrop-daemon dist/deskdrop/usr/local/bin/
          cp target/release/deskdrop-cli    dist/deskdrop/usr/local/bin/
          cp target/release/deskdrop-gtk    dist/deskdrop/usr/local/bin/
          cp platforms/linux/deskdrop.service dist/deskdrop/
          cp platforms/linux/deskdrop.desktop dist/deskdrop/
          cp README.md LICENSE dist/deskdrop/
          tar czf LinkAll-linux-x86_64.tar.gz -C dist deskdrop

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskdrop-linux
          path: LinkAll-linux-x86_64.tar.gz

  # ── Create GitHub Release ─────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [release-windows, release-android, release-linux, release-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Checksums
        run: |
          find release-artifacts -type f -exec sha256sum {} + | sed 's|release-artifacts/.*/||' > sha256sums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Link All ${{ github.ref_name }}"
          body: |
            ## Link All ${{ github.ref_name }}

            Proximity-Based Shared Clipboard — no account, no cloud, no setup.

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows 10/11 x64 | `LinkAll-windows-x64.msi` (installer) or `LinkAll-windows-x64.zip` (portable) |
            | Android 8.0+      | `LinkAll-android.apk` |
            | Linux x86_64      | `LinkAll-linux-x86_64.tar.gz` |
            | macOS (Apple Silicon) | `LinkAll.dmg` |

            ### What's new
            See [CHANGELOG.md](CHANGELOG.md).
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.zip
            release-artifacts/**/*.apk
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.dmg
            sha256sums.txt
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
