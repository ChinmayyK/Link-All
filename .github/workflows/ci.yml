name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Version consistency ───────────────────────────────────────────────────
  # Cheapest gate in the workflow, so it runs first. Every shippable artifact
  # has to carry the same version: versions drifted unnoticed across 1.2.5-1.2.8
  # because nothing checked them.
  versions:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/bump-version.sh --check

  # ── Rust core ──────────────────────────────────────────────────────────────
  rust-core:
    name: Rust Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            linkall-core
            linkall-cli
            platforms/linux

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libdbus-1-dev \
            libudev-dev \
            pkg-config \
            libssl-dev \
            avahi-daemon \
            libavahi-client-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --workspace

      - name: Run unit tests
        run: cargo test --workspace --lib

      - name: Run doc tests
        run: cargo test --workspace --doc

  # ── Integration tests (Linux only — requires mDNS) ────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libdbus-1-dev libudev-dev libssl-dev avahi-daemon
          sudo systemctl start avahi-daemon || true
      - name: Run integration tests
        run: cargo test --workspace --tests
        timeout-minutes: 5

  # ── Benchmarks (compile check only, no execution) ────────────────────────
  bench-check:
    name: Benchmark Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -y libdbus-1-dev libudev-dev libssl-dev
      # Type-check bench targets only. `cargo bench --no-run` additionally links
      # every workspace binary under the bench profile, which cannot succeed while
      # [profile.release] sets panic = "abort": bench targets are forced to unwind
      # but their dependency rlibs are built with abort, so the unwinding drop glue
      # is missing at link time. `cargo check` catches bench code rot without linking.
      - run: cargo check --benches --workspace

  # ── Cross-compile for Android ABIs ───────────────────────────────────────
  android:
    name: Android cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs "tools", which the SDK no longer ships.
          packages: 'platform-tools'

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Build for ${{ matrix.target }}
        run: |
          cargo ndk -t ${{ matrix.target }} build --lib --release -p linkall-core
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125

  # ── macOS dylib + Swift bridging header check ─────────────────────────────
  macos-platform:
    name: macOS platform build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build macOS dylib
        run: cargo build --release -p linkall-core

      - name: Build macOS app
        run: ./scripts/build-macos.sh --release

  # ── Windows C# build ──────────────────────────────────────────────────────
  windows-platform:
    name: Windows platform build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      # Native AOT publish needs the SDK the project targets (net10.0); the runner's
      # preinstalled SDKs are not guaranteed to include it.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Windows DLL
        run: cargo build --release -p linkall-core

      - name: Build C# project
        run: |
          # Create a stub DLL so the csproj can resolve the native ref.
          New-Item -ItemType Directory -Force -Path platforms\windows\LinkAll.WinUI\
          Copy-Item target\release\linkall_core.dll `
                    platforms\windows\LinkAll.WinUI\linkall_core.dll `
                    -ErrorAction SilentlyContinue
          dotnet build platforms\windows\LinkAll.WinUI\LinkAll.WinUI.csproj `
            -c Release

  # ── Security audit ────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # ── SBOM generation ───────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json
