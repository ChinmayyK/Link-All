[package]
name = "linkall-tray"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Link All Windows system tray helper (native Win32, no .NET runtime)"
publish = false

# The WinUI build copies target/<profile>/linkall-tray.exe to
# tray\LinkAll.Tray.exe, the name TrayService.cs launches and watches.
[[bin]]
name = "linkall-tray"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
