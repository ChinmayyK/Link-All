plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.linkall.benchmark'
    compileSdk 36

    defaultConfig {
        minSdk 28
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // app has a "distribution" flavor dimension; benchmark the full build.
        missingDimensionStrategy 'distribution', 'full'
    }

    targetProjectPath ':app'
    
    buildTypes {
        release {
            debuggable true
            signingConfig signingConfigs.debug
            // app:release runs R8 (minifyEnabled true in app/build.gradle), so this
            // test build type must declare shrinking too or
            // :benchmark:checkTestedAppObfuscationRelease fails on the mapping file.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.test.ext:junit:1.1.5'
    implementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.2.3'
}
