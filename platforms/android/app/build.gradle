plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.linkall'
    compileSdk 36

    defaultConfig {
        applicationId "app.linkall"
        minSdk 26           // Android 8.0 — foreground service type requires 26+
        targetSdk 36
        versionCode 48
        versionName "1.4.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("LINKALL_KEYSTORE")
            if (keystorePath != null) {
                def keystoreFile = file(keystorePath)
                if (!keystoreFile.exists()) {
                    throw new GradleException("Release keystore not found at ${keystoreFile.absolutePath}")
                }
                def storePw = System.getenv("LINKALL_STORE_PASSWORD")
                def alias   = System.getenv("LINKALL_KEY_ALIAS")
                def keyPw   = System.getenv("LINKALL_KEY_PASSWORD")
                if (!storePw || !alias || !keyPw) {
                    throw new GradleException(
                        "LINKALL_KEYSTORE is set but LINKALL_STORE_PASSWORD, " +
                        "LINKALL_KEY_ALIAS or LINKALL_KEY_PASSWORD is empty. " +
                        "Refusing to build an incorrectly signed release.")
                }
                storeFile keystoreFile
                storePassword storePw
                keyAlias alias
                keyPassword keyPw
            }
        }
    }

    // Two distributions from one codebase. "full" is the GitHub / direct-APK build with
    // SMS code forwarding, call answering and all-files access. "play" drops the
    // permissions Google Play only allows for default SMS/dialer apps and file managers
    // (see src/play/AndroidManifest.xml); code checks BuildConfig.FULL_PERMISSIONS.
    flavorDimensions "distribution"
    productFlavors {
        full {
            dimension "distribution"
            buildConfigField "boolean", "FULL_PERMISSIONS", "true"
        }
        play {
            dimension "distribution"
            buildConfigField "boolean", "FULL_PERMISSIONS", "false"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with the release keystore whenever LINKALL_KEYSTORE is set, which
            // covers CI and any signed local build. Without it there is no release key
            // available, so fall back to the debug key purely so that a local
            // `assembleRelease` still completes. That output is not distributable:
            // the debug signing key is public and shipped with every Android SDK.
            def useReleaseKey = System.getenv("LINKALL_KEYSTORE") != null
            signingConfig useReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            // Preserve debug symbols in release so crash reports are actionable
            keepDebugSymbols += '**/liblinkall_core.so'
        }
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Google Play Services Code Scanner (no camera permission required)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // ZXing for QR Code Generation
    implementation 'com.google.zxing:core:3.5.3'

    // Lifecycle (needed for LifecycleService if used in future)
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // WorkManager — used for deferred retry scheduling on battery-optimised mode
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7'

    // Coil for Image/Video Loading
    implementation 'io.coil-kt:coil-compose:2.5.0'
    implementation 'io.coil-kt:coil-video:2.5.0'
}
