[package]
name = "linkall-linux"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Link All for Linux: the GTK 4 app, tray icon and desktop agent"

[[bin]]
name = "linkall"
path = "src/main.rs"

# Everything here is Linux-only: on other platforms the binary is a stub, so
# `cargo build --workspace` on macOS and Windows doesn't need GTK installed.
[target.'cfg(target_os = "linux")'.dependencies]
linkall-core = { path = "../../linkall-core" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
serde_json = "1"
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
mime_guess = "2"
dirs = "5"
ksni = "0.2"
async-channel = "2"
libc = "0.2"
tracing = "0.1"
ureq = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
