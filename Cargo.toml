[workspace]
members = [
    "linkall-core",
    "linkall-cli",
    "platforms/linux",
    "platforms/windows/tray",
]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2021"
authors = ["Link All Contributors"]
license = "GPL-3.0-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# For tests that need release speed (the transfer benchmarks):
# `cargo test --profile perf`. With `--release`, cargo builds linkall-core
# twice, with panic=abort for the daemon and unwinding for the tests, into
# the same file name (a cdylib's has no hash), and now and then the daemon
# was linked against the wrong one and failed on undefined symbols.
[profile.perf]
inherits = "release"
panic = "unwind"

[profile.bench]
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.lz4_flex]
opt-level = 3
